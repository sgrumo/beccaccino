name: averziano

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-averziano_prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-averziano_prod}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    # Set by the deploy workflow to the exact image built for the deployed commit.
    image: ${APP_IMAGE:?APP_IMAGE is required, e.g. ghcr.io/sgrumo/beccaccino/app:<sha>}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PHX_SERVER: "true"
      PHX_HOST: ${PHX_HOST:?PHX_HOST is required}
      PORT: ${PORT:-4000}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      POOL_SIZE: ${POOL_SIZE:-10}
    ports:
      # Bound to loopback by default: the app expects TLS to terminate at a
      # reverse proxy (config/prod.exs sets force_ssl with x-forwarded-proto).
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-4000}:${PORT:-4000}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${PORT:-4000}/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  pgdata:
